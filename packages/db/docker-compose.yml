services:
  postgres:
    image: postgres:17-alpine
    container_name: practisync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: practisync_demo
      POSTGRES_USER: practisync
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - '5433:5432'
    volumes:
      - practisync-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U practisync -d practisync_demo']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  practisync-pg:
